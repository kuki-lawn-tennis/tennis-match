<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>テニス ダブルス組み合わせ抽選</title>
<style>
  :root { color-scheme: light; --green:#176b45; --line:#d9e2dc; --bg:#f4f7f5; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:#1e2923; }
  header { background:#176b45; color:white; padding:22px 16px; }
  header h1 { margin:0; font-size:22px; }
  header p { margin:7px 0 0; font-size:13px; opacity:.9; }
  main { max-width:900px; margin:20px auto; padding:0 14px 40px; }
  .panel { background:white; border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:16px; box-shadow:0 2px 8px #173b2410; }
  .fields { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
  label { display:block; font-size:14px; font-weight:650; }
  input { width:100%; margin-top:7px; padding:12px; border:1px solid #b9c8bf; border-radius:9px; font-size:17px; }
  .hint { font-size:12px; color:#64736a; margin:10px 0 0; line-height:1.6; }
  button { border:0; border-radius:10px; padding:13px 18px; font-size:15px; font-weight:700; cursor:pointer; }
  .primary { background:var(--green); color:white; width:100%; margin-top:14px; }
  .secondary { background:#e8f0eb; color:#145638; }
  .toolbar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between; }
  .summary { display:flex; gap:10px; flex-wrap:wrap; margin:12px 0 0; }
  .stat { background:#f0f5f1; border-radius:9px; padding:10px 13px; min-width:100px; }
  .stat small { display:block; color:#64736a; font-size:11px; }
  .stat strong { font-size:20px; }
  .round { margin-top:16px; }
  .round h3 { margin:0 0 9px; font-size:16px; }
  .match { border:1px solid var(--line); border-radius:11px; padding:12px; margin:8px 0; }
  .match-head { display:flex; justify-content:space-between; gap:8px; align-items:center; margin-bottom:10px; font-size:13px; color:#526258; }
  .court { font-weight:750; color:#176b45; }
  .teams { display:grid; grid-template-columns:1fr auto 1fr; gap:9px; align-items:center; }
  .team { background:#f3f7f4; border-radius:8px; padding:11px 8px; text-align:center; font-weight:700; }
  .vs { color:#78857d; font-size:12px; font-weight:700; }
  .waiting { margin-top:9px; font-size:12px; color:#5d6c62; line-height:1.6; }
  .empty { color:#65736a; text-align:center; padding:22px 8px; }
  @media(max-width:520px) { .fields { grid-template-columns:1fr; } header h1 {font-size:19px;} .team {font-size:14px;} }
  @media print {
    body { background:white; }
    header { background:white; color:black; padding:0 0 12px; }
    main { max-width:none; margin:0; padding:0; }
    .panel:first-child, .toolbar button { display:none !important; }
    .panel { box-shadow:none; border:0; padding:0; }
    .match { break-inside:avoid; }
  }
</style>
</head>
<body>
<header>
  <h1>テニス ダブルス組み合わせ抽選</h1>
  <p>コート数・参加人数を入力して、合計100試合を完全ランダムで作成します。</p>
</header>
<main>
  <section class="panel">
    <div class="fields">
      <label>コート数
        <input id="courts" type="number" min="1" max="30" value="3">
      </label>
      <label>参加人数
        <input id="players" type="number" min="4" max="200" value="20">
      </label>
    </div>
    <p class="hint">1試合につき4人（ダブルス）。各ラウンドで参加者をシャッフルし、使えるコートに4人ずつ割り当てます。余った人は待機です。ペア・対戦相手・出場回数の重複や偏りは調整しません。</p>
    <button class="primary" id="generate">100試合をランダム作成</button>
    <p class="hint" id="error" role="alert" style="color:#b42318"></p>
  </section>
  <section class="panel" id="results">
    <div class="empty">コート数と参加人数を確認して「100試合をランダム作成」を押してください。</div>
  </section>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const TOTAL = 100;
  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function make() {
    const courts = Number($('courts').value);
    const count = Number($('players').value);
    $('error').textContent = '';
    if (!Number.isInteger(courts) || courts < 1 || courts > 30) {
      $('error').textContent = 'コート数は1〜30の整数で入力してください。'; return;
    }
    if (!Number.isInteger(count) || count < 4 || count > 200) {
      $('error').textContent = '参加人数は4〜200人の整数で入力してください。'; return;
    }
    const perRound = Math.min(courts, Math.floor(count / 4));
    const rounds = Math.ceil(TOTAL / perRound);
    const players = Array.from({length:count}, (_,i)=>i+1);
    let matchNo = 0;
    let out = `<div class="toolbar"><div><strong>抽選結果</strong><div class="hint">合計${TOTAL}試合・${rounds}ラウンド（1ラウンド最大${perRound}試合）</div></div><div><button class="secondary" id="again">再抽選</button> <button class="secondary" id="print">印刷</button></div></div>`;
    out += `<div class="summary"><div class="stat"><small>コート数</small><strong>${courts}</strong></div><div class="stat"><small>参加人数</small><strong>${count}</strong></div><div class="stat"><small>1ラウンドの試合数</small><strong>${perRound}</strong></div><div class="stat"><small>合計試合数</small><strong>${TOTAL}</strong></div></div>`;
    for (let r=1; r<=rounds; r++) {
      const remaining = TOTAL - matchNo;
      const thisRound = Math.min(perRound, remaining);
      const shuffled = shuffle(players.slice());
      const playing = thisRound * 4;
      const waiting = shuffled.slice(playing);
      out += `<div class="round"><h3>第${r}ラウンド</h3>`;
      for (let c=1; c<=thisRound; c++) {
        const p = shuffled.slice((c-1)*4, c*4);
        matchNo++;
        out += `<div class="match"><div class="match-head"><span>第${matchNo}試合</span><span class="court">コート${c}</span></div><div class="teams"><div class="team">${p[0]}番 ・ ${p[1]}番</div><div class="vs">VS</div><div class="team">${p[2]}番 ・ ${p[3]}番</div></div></div>`;
      }
      out += `<div class="waiting">待機：${waiting.length ? waiting.map(n=>n+'番').join('、') : 'なし'}</div></div>`;
    }
    $('results').innerHTML = out;
    $('again').addEventListener('click', make);
    $('print').addEventListener('click', () => window.print());
    $('results').scrollIntoView({behavior:'smooth', block:'start'});
  }
  $('generate').addEventListener('click', make);
})();
</script>
</body>
</html>
