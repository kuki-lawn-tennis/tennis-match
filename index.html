<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>テニス ダブルス組み合わせ抽選</title>
  <style>
    :root {
      --green: #176b45;
      --green-dark: #145638;
      --bg: #f4f7f5;
      --text: #203027;
      --muted: #64736a;
      --border: #d9e2dc;
      --soft: #f0f5f1;
      --error: #b42318;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans",
                   "Noto Sans JP", Meiryo, sans-serif;
    }

    /* ---------- レイアウト ---------- */
    header {
      background: var(--green);
      color: #fff;
      padding: 20px 16px;
    }
    header h1 { margin: 0; font-size: 21px; }
    header .hint { color: #fff; margin: 4px 0 0; }

    main {
      max-width: 850px;
      margin: 18px auto;
      padding: 0 12px 40px;
    }

    .panel {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 15px;
      margin-bottom: 14px;
    }

    .hint {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.6;
    }

    /* ---------- 入力フォーム ---------- */
    .fields {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      font-size: 18px;
    }

    label { font-weight: 650; font-size: 18px; }

    input[type=number] {
      display: block;
      width: 100%;
      margin-top: 6px;
      padding: 12px;
      border: 1px solid #b9c8bf;
      border-radius: 8px;
      font-size: 18px;
    }

    .error { color: var(--error); font-size: 14px; font-weight: 700; min-height: 1.6em; margin: 8px 0 0; }

    /* ---------- ボタン ---------- */
    button {
      border: 0;
      border-radius: 9px;
      padding: 13px 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .primary   { background: var(--green); color: #fff; width: 100%; margin-top: 14px; }
    .secondary { background: #e8f0eb; color: var(--green-dark); }

    /* ---------- 結果ヘッダー ---------- */
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .stats { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
    .stat  { background: var(--soft); padding: 9px 12px; border-radius: 8px; }
    .stat small { display: block; color: var(--muted); font-size: 11px; }
    .stat b { font-size: 19px; }

    /* ---------- ラウンド・試合 ---------- */
    .round { 
      margin-top: 18px;
      font-size: 20px;
    }

    .all-check-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 650;
      cursor: pointer;
      margin: 4px 0 12px;
    }
    .all-check-label input { width: 23px; height: 23px; accent-color: var(--green); }

    .next-area { margin-top: 18px; }
    .next-area .primary { margin-top: 0; }
    .next-area .primary:disabled { background: #b9c8bf; cursor: not-allowed; }
    .next-area .hint { margin: 6px 0 0; text-align: center; }

    .match {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px;
      margin: 8px 0;
    }
    .match.done { background: #f0f7f2; border-color: #9bc5a8; }

    .match-head {
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      color: #526258;
      margin-bottom: 9px;
    }

    .teams {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 7px;
      align-items: center;
    }
    .team {
      background: #f1f6f2;
      padding: 12px 5px;
      text-align: center;
      border-radius: 8px;
      font-weight: 700;
      font-size: 30px;
    }
    .vs { font-size: 12px; color: #78857d; }

    .match-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 11px;
      padding-top: 9px;
      border-top: 1px solid #e1e9e3;
    }
    .complete-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      cursor: pointer;
    }
    .complete-label input { width: 21px; height: 21px; accent-color: var(--green); }

    .done-badge { display: none; font-size: 12px; font-weight: 700; color: var(--green); }
    .match.done .done-badge { display: inline; }

    .waiting { font-size: 16px; color: #5d6c62; line-height: 1.6; margin-top: 8px; }

    /* ---------- 出場回数表 ---------- */
    table { width: 100%; border-collapse: collapse; font-size: 20px; }
    th, td { padding: 8px; border-bottom: 1px solid var(--border); text-align: center; }
    td.done-cell { font-weight: 700; color: var(--green); }

    @media (max-width: 500px) {
      .fields { grid-template-columns: 1fr; }
    }

    @media print {
      header { background: #fff; color: #000; }
      header .hint { color: #000; }
      main { margin: 0; }
      .panel:first-child, .toolbar button, .match-bottom, .all-check-label, .next-area { display: none; }
      .panel { border: 0; }
      .match { break-inside: avoid; }
    }
  </style>
</head>

<body>
  <header>
    <h1>テニス ダブルス組み合わせ抽選</h1>
    <p class="hint">出場回数を均等化し、ペアと対戦相手をランダムに決定</p>
  </header>

  <main>
    <section class="panel">
      <div class="fields">
        <label>コート数
          <input id="courts" type="number" min="1" max="30" value="1" inputmode="numeric">
        </label>
        <label>参加人数
          <input id="players" type="number" min="4" max="200" value="6" inputmode="numeric">
        </label>
        <label>試合数
          <input id="totalMatches" type="number" min="1" max="1000" value="10" inputmode="numeric">
        </label>
      </div>
      <p class="hint">
        試合数はコート数の倍数に切り上げ、全ラウンドで全コートを使います。ラウンドは1つずつ作成します。
        次のラウンドは、完了にした試合の実績（直前のラウンドは出場済み扱い）をもとに、出場回数が少ない人を優先して選びます（同数の中ではランダム）。
      </p>
      <button class="primary" id="generate" type="button">組み合わせを作成</button>
      <p id="error" class="hint error" role="alert"></p>
    </section>

    <section class="panel" id="results">
      <div class="hint">コート数・参加人数・試合数を入力して「組み合わせを作成」を押してください。</div>
    </section>
  </main>

  <script>
  (() => {
    'use strict';

    const $ = id => document.getElementById(id);
    let session = null;        // { courts, n, totalRounds, rounds: [] }
    let matchByNo = new Map(); // 試合番号 → 試合

    /* ---------- ユーティリティ ---------- */
    function shuffle(array) {
      const a = array.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function readInt(id, min, max, label) {
      const value = Number($(id).value);
      if (!Number.isInteger(value) || value < min || value > max) {
        throw new Error(label + 'は' + min + '〜' + max + 'で入力してください。');
      }
      return value;
    }

    /* ---------- 抽選ロジック ---------- */

    // 実績の集計：完了にチェックが入っている試合に加え、
    // 直前のラウンドは進行中として全試合を出場済みに数える
    // （未完了でも次を作ったときに、同じ人が続けて選ばれないようにするため）
    function collectStats(n) {
      const played = Array(n + 1).fill(0);                 // 出場回数
      const partner = new Uint16Array((n + 1) * (n + 1));  // ペアになった回数
      const opponent = new Uint16Array((n + 1) * (n + 1)); // 対戦した回数
      const at = (a, b) => (a < b ? a * (n + 1) + b : b * (n + 1) + a);

      const lastRound = session.rounds[session.rounds.length - 1];
      const counted = new Set(lastRound ? lastRound.matches.map(m => m.no) : []);
      document.querySelectorAll('.match-check:checked').forEach(x => counted.add(Number(x.dataset.match)));

      counted.forEach(no => {
        const m = matchByNo.get(no);
        const [a, b] = m.teamA, [c, d] = m.teamB;
        [a, b, c, d].forEach(p => played[p]++);
        partner[at(a, b)]++;
        partner[at(c, d)]++;
        opponent[at(a, c)]++; opponent[at(a, d)]++;
        opponent[at(b, c)]++; opponent[at(b, d)]++;
      });

      // 直近で連続して待機した回数（出場回数が同じ人の中での優先順に使う）
      const rest = Array(n + 1).fill(0);
      for (let p = 1; p <= n; p++) {
        for (let i = session.rounds.length - 1; i >= 0 && session.rounds[i].waiting.includes(p); i--) rest[p]++;
      }
      return { played, rest, partner, opponent, at };
    }

    // 1ラウンド分を作る（実績 stats をもとに選出と並べ替え）
    function createRound(stats, courts, n, roundIndex) {
      const { played, rest, partner, opponent, at } = stats;
      const ids = Array.from({ length: n }, (_, i) => i + 1);

      // 並べ方の悪さ：同じペアは重く、同じ対戦相手は軽くカウント
      function cost(arr) {
        let c = 0;
        for (let i = 0; i < arr.length; i += 4) {
          const a = arr[i], b = arr[i + 1], x = arr[i + 2], y = arr[i + 3];
          c += 10 * (partner[at(a, b)] + partner[at(x, y)]);
          c += opponent[at(a, x)] + opponent[at(a, y)] + opponent[at(b, x)] + opponent[at(b, y)];
        }
        return c;
      }

      // 出場回数が同じ人同士だけを入れ替えて並べる（回数の順序は崩さない）
      function shuffleTies(arr) {
        const out = [];
        for (let i = 0; i < arr.length; ) {
          let j = i;
          while (j < arr.length && played[arr[j]] === played[arr[i]]) j++;
          out.push(...shuffle(arr.slice(i, j)));
          i = j;
        }
        return out;
      }

      // 同じ回数の人の中で、ランダム抽選＋山登りにより重複の少ない並べ方を探す
      function arrange(sorted) {
        let best = shuffleTies(sorted);
        let bestCost = cost(best);

        for (let t = 0; t < 200 && bestCost > 0; t++) {
          const cand = shuffleTies(sorted);
          const c = cost(cand);
          if (c < bestCost) { best = cand; bestCost = c; }
        }

        const len = best.length;
        for (let t = 0; t < 400 && bestCost > 0; t++) {
          const i = Math.floor(Math.random() * len);
          const j = Math.floor(Math.random() * len);
          if (i === j || played[best[i]] !== played[best[j]]) continue;
          [best[i], best[j]] = [best[j], best[i]];
          const c = cost(best);
          if (c <= bestCost) bestCost = c;
          else [best[i], best[j]] = [best[j], best[i]];
        }
        return best;
      }

      // 出場回数が少ない順に必要人数を選ぶ。
      // 同数の中では、直前のラウンドで待機していた人（連続待機が長い人）を優先し、
      // それも同じならランダム（事前にシャッフルしてから安定ソートする）
      const chosen = shuffle(ids)
        .sort((a, b) => played[a] - played[b] || rest[b] - rest[a])
        .slice(0, courts * 4);
      const chosenSet = new Set(chosen);

      // 回数が少ない人から順に、先頭の試合・左のチームの先頭へ詰める
      //   1試合目 = [A1・A2 vs B1・B2]、2試合目 = …
      const arranged = arrange(chosen);
      const matches = [];
      for (let c = 0; c < courts; c++) {
        const [a, b, x, y] = arranged.slice(c * 4, c * 4 + 4);
        matches.push({ no: roundIndex * courts + c + 1, court: c + 1, teamA: [a, b], teamB: [x, y] });
      }
      return { matches, waiting: ids.filter(x => !chosenSet.has(x)) };
    }

    /* ---------- 描画 ---------- */
    const pairText = pair => pair[0] + '・' + pair[1];

    function renderMatch(m) {
      return `
        <div class="match" id="match-${m.no}">
          <div class="match-head"><span>第${m.no}試合</span><b>コート${m.court}</b></div>
          <div class="teams">
            <div class="team">${pairText(m.teamA)}</div>
            <div class="vs">VS</div>
            <div class="team">${pairText(m.teamB)}</div>
          </div>
          <div class="match-bottom">
            <label class="complete-label">
              <input type="checkbox" class="match-check" data-match="${m.no}"> 試合完了
            </label>
            <span class="done-badge">完了</span>
          </div>
        </div>`;
    }

    function renderRound(round, index) {
      const waiting = round.waiting.length
        ? round.waiting.map(x => x + '番').join('、')
        : 'なし';
      return `
        <div class="round" id="round-${index + 1}">
          <b>🎾第${index + 1}ラウンド</b>
          ${round.matches.map(renderMatch).join('')}
          <div class="waiting">待機：${waiting}</div>
        </div>`;
    }

    function renderCountTable(n) {
      const rows = Array.from({ length: n }, (_, i) => `
          <tr>
            <td>${i + 1}番</td>
            <td class="done-cell" id="done-count-${i + 1}">0回</td>
          </tr>`).join('');
      return `
        <div class="round">
          <b>参加者別 試合数</b>
          <table>
            <thead><tr><th>参加者番号</th><th>完了試合数</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;
    }

    function renderResults(requested) {
      const { courts, n, totalRounds } = session;
      const total = totalRounds * courts;
      $('results').innerHTML = `
        <div class="toolbar">
          <b>抽選結果：${totalRounds}ラウンド・合計${total}試合</b>
          <span>
            <button class="secondary" data-action="again" type="button">再抽選</button>
            <button class="secondary" data-action="print" type="button">印刷</button>
          </span>
        </div>
        ${requested !== total
          ? `<p class="hint">入力された${requested}試合を、全コートを使い切る${total}試合（${totalRounds}ラウンド）に調整しました。</p>`
          : ''}
        <div class="stats">
          <div class="stat"><small>コート数</small><b>${courts}</b></div>
          <div class="stat"><small>参加人数</small><b>${n}</b></div>
          <div class="stat"><small>合計試合数</small><b>${total}</b></div>
          <div class="stat"><small>作成済みラウンド</small><b id="createdRounds">0</b></div>
          <div class="stat"><small>完了試合数</small><b id="doneCount">0</b></div>
        </div>
        <label class="all-check-label">
          <input type="checkbox" id="checkAll"> 作成済みの全ラウンドを一括で完了にする
        </label>
        <div id="rounds"></div>
        <div class="next-area" id="nextArea"></div>
        ${renderCountTable(n)}`;
    }

    // ラウンドを1つ作って末尾に追加する
    function addRound() {
      const { courts, n } = session;
      const index = session.rounds.length;
      const round = createRound(collectStats(n), courts, n, index);

      session.rounds.push(round);
      round.matches.forEach(m => matchByNo.set(m.no, m));
      $('rounds').insertAdjacentHTML('beforeend', renderRound(round, index));
      $('createdRounds').textContent = session.rounds.length;
      updateProgress();
      return index + 1;
    }

    // 「次のラウンドを作成」ボタン：直前のラウンドが未完了でも押せる
    function updateNextArea(lastDone) {
      const created = session.rounds.length;
      if (created >= session.totalRounds) {
        $('nextArea').innerHTML = '<p class="hint">全ラウンドを作成しました。</p>';
        return;
      }
      $('nextArea').innerHTML = `
        <button class="primary" data-action="next" type="button">
          第${created + 1}ラウンドを作成
        </button>
        <p class="hint">${lastDone
          ? '完了試合数の実績をもとに、出場回数が均等になるよう組みます。'
          : '第' + created + 'ラウンドに未完了の試合があります。作成すると、第' + created + 'ラウンドは出場済みとして扱います。'}</p>`;
    }

    function updateProgress() {
      const checks = [...document.querySelectorAll('.match-check')];
      const done = checks.filter(x => x.checked).length;
      $('doneCount').textContent = done;

      // 一括チェック：全試合完了ならON、一部だけなら中間表示
      const all = $('checkAll');
      all.checked = checks.length > 0 && done === checks.length;
      all.indeterminate = done > 0 && done < checks.length;
      checks.forEach(x => $('match-' + x.dataset.match).classList.toggle('done', x.checked));

      // 参加者別の完了試合数：チェック状態から毎回数え直す（外せば自動で減算）
      const tally = Array(session.n + 1).fill(0);
      checks.filter(x => x.checked).forEach(x => {
        const m = matchByNo.get(Number(x.dataset.match));
        [...m.teamA, ...m.teamB].forEach(p => tally[p]++);
      });
      for (let i = 1; i <= session.n; i++) {
        $('done-count-' + i).textContent = tally[i] + '回';
      }

      // 最後に作ったラウンドが全て完了か
      const last = session.rounds[session.rounds.length - 1];
      const lastDone = last.matches.every(m => $('match-' + m.no).querySelector('.match-check').checked);
      updateNextArea(lastDone);
    }

    /* ---------- 実行 ---------- */
    // 作り直しの確認：confirm() は埋め込み表示などで無効になり、
    // ボタンが効かないように見えるため、ボタンの2回押しで確認する
    let armed = null, armTimer = null;

    function disarm() {
      if (!armed) return;
      armed.btn.textContent = armed.label;
      armed = null;
      clearTimeout(armTimer);
    }

    function confirmByButton(btn) {
      if (armed && armed.btn === btn) { disarm(); return true; } // 2回目の押下で実行
      disarm();
      armed = { btn, label: btn.textContent };
      btn.textContent = 'もう一度押すと再組合';
      armTimer = setTimeout(disarm, 4000);
      return false;
    }

    function draw(btn) {
      $('error').textContent = '';
      try {
        const courts = readInt('courts', 1, 30, 'コート数');
        const n      = readInt('players', 4, 200, '参加人数');
        const requested = readInt('totalMatches', 1, 1000, '試合数');

        // 全コートを同時に使うには、1コートあたり4人が必要
        if (n < courts * 4) {
          throw new Error('コート数' + courts + 'には最低' + (courts * 4) + '人必要です。'
            + 'コート数を減らすか、参加人数を増やしてください。');
        }

        // 作成済みの組み合わせやチェックが消える前に確認する
        if (session && (document.querySelector('.match-check:checked') || session.rounds.length > 1) &&
            !confirmByButton(btn)) {
          return;
        }

        // 試合数は「コート数の倍数」に切り上げ、最終ラウンドも全コートを使う
        const totalRounds = Math.ceil(requested / courts);

        session = { courts, n, totalRounds, rounds: [] };
        matchByNo = new Map();
        renderResults(requested);
        addRound(); // 最初は第1ラウンドだけ作る
        $('results').scrollIntoView({ behavior: 'smooth' });
      } catch (e) {
        $('error').textContent = e.message;
      }
    }

    $('generate').addEventListener('click', e => draw(e.currentTarget));

    // 結果エリアのイベントは1回だけ登録（再描画しても付け直し不要）
    $('results').addEventListener('change', e => {
      const t = e.target;
      if (t.id === 'checkAll') {
        // 作成済みの全試合をまとめて ON/OFF
        document.querySelectorAll('.match-check').forEach(x => { x.checked = t.checked; });
        updateProgress();
      } else if (t.classList.contains('match-check')) {
        updateProgress();
      }
    });
    $('results').addEventListener('click', e => {
      const action = e.target.dataset.action;
      if (action === 'again') draw(e.target);
      if (action === 'print') window.print();
      if (action === 'next') {
        const no = addRound();
        $('round-' + no).scrollIntoView({ behavior: 'smooth' });
      }
    });
  })();
  </script>
</body>
</html>
