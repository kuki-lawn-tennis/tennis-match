<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>テニス ダブルス組み合わせ抽選</title>
  <style>
    :root {
      --green: #176b45;
      --green-dark: #145638;
      --bg: #f4f7f5;
      --text: #203027;
      --muted: #64736a;
      --border: #d9e2dc;
      --soft: #f0f5f1;
      --error: #b42318;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans",
                   "Noto Sans JP", Meiryo, sans-serif;
    }

    /* ---------- レイアウト ---------- */
    header {
      background: var(--green);
      color: #fff;
      padding: 20px 16px;
    }
    header h1 {
      margin: 0;
      font-size: 21px;
    }
    header .hint {
      color: #fff;
      margin: 4px 0 0;
    }

    main {
      max-width: 850px;
      margin: 18px auto;
      padding: 0 12px 40px;
    }

    .panel {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 15px;
      margin-bottom: 14px;
    }

    .hint {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.6;
    }

    /* ---------- 入力フォーム ---------- */
    .fields {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    label {
      font-weight: 650;
      font-size: 18px;
    }

    input[type=number] {
      display: block;
      width: 100%;
      margin-top: 6px;
      padding: 12px;
      border: 1px solid #b9c8bf;
      border-radius: 8px;
      font-size: 18px;
    }

    .mode {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 20px;
      margin-top: 14px;
      font-size: 18px;
    }
    .mode-title {
      font-weight: 650;
    }
    .mode-option {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .mode-option input {
      width: 20px;
      height: 20px;
      margin: 0;
      accent-color: var(--green);
    }

    .error {
      color: var(--error);
      font-size: 14px;
      font-weight: 700;
      min-height: 1.6em;
      margin: 8px 0 0;
    }

    /* ---------- ボタン ---------- */
    button {
      border: 0;
      border-radius: 9px;
      padding: 13px 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .primary {
      background: var(--green);
      color: #fff;
      width: 100%;
      margin-top: 14px;
    }
    .secondary {
      background: #e8f0eb;
      color: var(--green-dark);
    }

    /* ---------- 結果ヘッダー ---------- */
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .stats {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 12px 0;
    }
    .stat {
      background: var(--soft);
      padding: 9px 12px;
      border-radius: 8px;
    }
    .stat small {
      display: block;
      color: var(--muted);
      font-size: 11px;
    }
    .stat b {
      font-size: 19px;
    }

    /* ---------- ラウンド・試合 ---------- */
    .round {
      margin-top: 18px;
      font-size: 20px;
    }

    .all-check-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 650;
      cursor: pointer;
      margin: 4px 0 12px;
    }
    .all-check-label input {
      width: 23px;
      height: 23px;
      accent-color: var(--green);
    }

    .next-area {
      margin-top: 18px;
    }
    .next-area .primary {
      margin-top: 0;
    }
    .next-area .hint {
      margin: 6px 0 0;
      text-align: center;
    }

    .match {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px;
      margin: 8px 0;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .match:focus-visible {
      outline: 3px solid var(--green);
      outline-offset: 2px;
    }
    .match.done {
      background: #f0f7f2;
      border-color: #9bc5a8;
    }

    .match-head {
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      color: #526258;
      margin-bottom: 9px;
    }

    .teams {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 7px;
      align-items: center;
    }
    .team {
      background: #f1f6f2;
      padding: 12px 5px;
      text-align: center;
      border-radius: 8px;
      font-weight: 700;
      font-size: 30px;
    }
    .vs {
      font-size: 12px;
      color: #78857d;
    }

    .match-bottom {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 11px;
      padding-top: 9px;
      border-top: 1px solid #e1e9e3;
    }
    .tap-hint {
      font-size: 14px;
      color: var(--muted);
    }
    .match.done .tap-hint {
      display: none;
    }

    .done-badge {
      display: none;
      font-size: 14px;
      font-weight: 700;
      color: var(--green);
    }
    .match.done .done-badge {
      display: inline;
    }

    .waiting {
      font-size: 16px;
      color: #5d6c62;
      line-height: 1.6;
      margin-top: 8px;
    }

    /* ---------- 出場回数表 ---------- */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 20px;
    }
    th, td {
      padding: 8px;
      border-bottom: 1px solid var(--border);
      text-align: center;
    }
    td.done-cell {
      font-weight: 700;
      color: var(--green);
    }
    .count-title {
      display: block;
      text-align: center;
      font-size: 22px;
    }

    @media (max-width: 500px) {
      .fields {
        grid-template-columns: 1fr;
      }
    }

    @media print {
      header {
        background: #fff;
        color: #000;
      }
      header .hint {
        color: #000;
      }
      main {
        margin: 0;
      }
      .panel:first-child,
      .toolbar button,
      .match-bottom,
      .all-check-label,
      .next-area {
        display: none;
      }
      .panel {
        border: 0;
      }
      .match {
        break-inside: avoid;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>テニス ダブルス組み合わせ抽選</h1>
    <p class="hint">出場回数を均等化し、ペアと対戦相手をランダムに決定</p>
  </header>

  <main>
    <section class="panel">
      <div class="fields">
        <label>コート数
          <input id="courts" type="number" min="1" max="30" value="1" inputmode="numeric">
        </label>
        <label>参加人数
          <input id="players" type="number" min="4" max="200" value="6" inputmode="numeric">
        </label>
        <label>試合数
          <input id="totalMatches" type="number" min="1" max="1000" value="10" inputmode="numeric">
        </label>
      </div>
      <div class="mode" role="radiogroup" aria-label="作成モード">
        <span class="mode-title">作成モード</span>
        <label class="mode-option"><input type="radio" name="mode" value="seq" checked> 順次作成</label>
        <label class="mode-option"><input type="radio" name="mode" value="bulk"> 一括作成</label>
      </div>
      <p class="hint">
        試合数はコート数の倍数に切り上げ、全ラウンドで全コートを使います。
        順次作成は、ラウンドを1つずつ作成します。
        一括作成は、全ラウンドを最初にまとめて作成します。
      </p>
      <button class="primary" id="generate" type="button">組み合わせを作成</button>
      <p id="error" class="hint error" role="alert"></p>
    </section>

    <section class="panel" id="results">
      <div class="hint">コート数・参加人数・試合数を入力して「組み合わせを作成」を押してください。</div>
    </section>
  </main>

  <script>
  (() => {
    'use strict';

    const $ = id => document.getElementById(id);
    let session = null;        // { courts, n, totalRounds, rounds: [], mode: 'bulk' | 'seq', requested }
    let matchByNo = new Map(); // 試合番号 → 試合

    /* ---------- ユーティリティ ---------- */
    function shuffle(array) {
      const a = array.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // 範囲は入力欄の min / max（HTML側）を使う
    function readInt(id, label) {
      const el = $(id);
      const min = Number(el.min), max = Number(el.max), value = Number(el.value);
      if (!Number.isInteger(value) || value < min || value > max) {
        throw new Error(label + 'は' + min + '〜' + max + 'で入力してください。');
      }
      return value;
    }

    /* ---------- 抽選ロジック ---------- */

    function newStats(n) {
      return {
        played: Array(n + 1).fill(0),                 // 出場回数
        partner: new Uint16Array((n + 1) * (n + 1)),  // ペアになった回数
        at: (a, b) => (a < b ? a * (n + 1) + b : b * (n + 1) + a)
      };
    }

    // 試合のリストを実績に加える
    function countMatches(stats, matches) {
      const { played, partner, at } = stats;
      matches.forEach(m => {
        const [a, b] = m.teamA, [c, d] = m.teamB;
        [a, b, c, d].forEach(p => played[p]++);
        partner[at(a, b)]++;
        partner[at(c, d)]++;
      });
    }

    // 順次作成の実績：完了にチェックが入っている試合に加え、
    // 直前のラウンドは進行中として全試合を出場済みに数える
    // （未完了でも次を作ったときに、同じ人が続けて選ばれないようにするため）
    function collectStats(n) {
      const lastRound = session.rounds[session.rounds.length - 1];
      const counted = new Set(lastRound ? lastRound.matches.map(m => m.no) : []);
      document.querySelectorAll('.match-check:checked').forEach(x => counted.add(Number(x.dataset.match)));

      const stats = newStats(n);
      countMatches(stats, [...counted].map(no => matchByNo.get(no)));
      return stats;
    }

    // 1ラウンド分を作る（実績 stats をもとに選出と並べ替え）
    function createRound(stats, courts, n, roundIndex) {
      const { played, partner, at } = stats;
      const ids = Array.from({ length: n }, (_, i) => i + 1);

      // 並べ方の悪さ：同じペアになった回数の合計（対戦相手の重複は見ない）
      function cost(arr) {
        let c = 0;
        for (let i = 0; i < arr.length; i += 4) {
          c += partner[at(arr[i], arr[i + 1])] + partner[at(arr[i + 2], arr[i + 3])];
        }
        return c;
      }

      // 出場回数が同じ人同士だけを入れ替えて並べる（回数の順序は崩さない）
      function shuffleTies(arr) {
        const out = [];
        for (let i = 0; i < arr.length; ) {
          let j = i;
          while (j < arr.length && played[arr[j]] === played[arr[i]]) j++;
          out.push(...shuffle(arr.slice(i, j)));
          i = j;
        }
        return out;
      }

      // 出場回数が少ない順に必要人数を選ぶ。
      //   ・境目より回数の少ない人は全員出場（sure）
      //   ・境目と同じ回数の人（pool）は、その中から不足分を選ぶ。
      //     誰を選ぶかは待機の有無ではなく、同じペアが重ならないことで決める
      const need = courts * 4;
      const order = shuffle(ids).sort((a, b) => played[a] - played[b]);
      const cut = played[order[need - 1]];
      const sure = order.filter(p => played[p] < cut);
      const pool = order.filter(p => played[p] === cut);
      const take = need - sure.length;

      function build() {
        const sh = shuffle(pool);
        return { arr: shuffleTies([...sure, ...sh.slice(0, take)]), spare: sh.slice(take) };
      }

      // ランダム抽選＋山登りで、同じペアの少ない「選び方・並べ方」を探す
      let cur = build();
      let curCost = cost(cur.arr);

      for (let t = 0; t < 200 && curCost > 0; t++) {
        const cand = build();
        const c = cost(cand.arr);
        if (c < curCost) { cur = cand; curCost = c; }
      }

      const { arr, spare } = cur;
      for (let t = 0; t < 400 && curCost > 0; t++) {
        const i = Math.floor(Math.random() * arr.length);
        if (spare.length && played[arr[i]] === cut && Math.random() < 0.5) {
          // 出場者と、同じ回数の待機候補を入れ替える
          const k = Math.floor(Math.random() * spare.length);
          [arr[i], spare[k]] = [spare[k], arr[i]];
          const c = cost(arr);
          if (c <= curCost) curCost = c;
          else [arr[i], spare[k]] = [spare[k], arr[i]];
        } else {
          // 出場者同士で、同じ回数の人を入れ替える
          const j = Math.floor(Math.random() * arr.length);
          if (i === j || played[arr[i]] !== played[arr[j]]) continue;
          [arr[i], arr[j]] = [arr[j], arr[i]];
          const c = cost(arr);
          if (c <= curCost) curCost = c;
          else [arr[i], arr[j]] = [arr[j], arr[i]];
        }
      }

      // 回数が少ない人から順に、先頭の試合・左のチームの先頭へ詰める
      //   1試合目 = [A1・A2 vs B1・B2]、2試合目 = …
      const chosenSet = new Set(arr);
      const matches = [];
      for (let c = 0; c < courts; c++) {
        const [a, b, x, y] = arr.slice(c * 4, c * 4 + 4);
        matches.push({ no: roundIndex * courts + c + 1, court: c + 1, teamA: [a, b], teamB: [x, y] });
      }
      return { matches, waiting: ids.filter(x => !chosenSet.has(x)) };
    }

    // 一括作成：全ラウンドを、作成済みのラウンドをすべて実績として数えながら順に作る。
    // existing（作成済みのラウンド）があるときは、その続きのラウンドだけを作って返す。
    // 何通りか作り直して、同じペアの重複が最も少ない組み合わせを採用する
    // （入力が大きいときは時間で打ち切り、最低1通りは必ず作る）
    function buildAll(courts, n, totalRounds, existing = []) {
      const pairRepeats = partner => partner.reduce((t, v) => t + (v > 1 ? v - 1 : 0), 0);
      const base = existing.flatMap(r => r.matches);
      const started = performance.now();
      let best = null, bestScore = Infinity;

      for (let attempt = 0; attempt < 20; attempt++) {
        const stats = newStats(n);
        countMatches(stats, base);
        const rounds = [];
        for (let r = existing.length; r < totalRounds; r++) {
          const round = createRound(stats, courts, n, r);
          rounds.push(round);
          countMatches(stats, round.matches);
        }
        const score = pairRepeats(stats.partner);
        if (score < bestScore) { best = rounds; bestScore = score; }
        if (bestScore === 0 || performance.now() - started > 400) break;
      }
      return best;
    }

    /* ---------- 描画 ---------- */
    const pairText = pair => pair[0] + '・' + pair[1];

    function renderMatch(m) {
      return `
        <div class="match" id="match-${m.no}" role="button" tabindex="0" aria-pressed="false">
          <div class="match-head"><span>第${m.no}試合</span><b>コート${m.court}</b></div>
          <div class="teams">
            <div class="team">${pairText(m.teamA)}</div>
            <div class="vs">VS</div>
            <div class="team">${pairText(m.teamB)}</div>
          </div>
          <div class="match-bottom">
            <span class="tap-hint">タッチで完了</span>
            <span class="done-badge">✔ 完了（もう一度タッチで取消）</span>
            <input type="checkbox" class="match-check" data-match="${m.no}" hidden>
          </div>
        </div>`;
    }

    function renderRound(round, index) {
      const waiting = round.waiting.length
        ? round.waiting.map(x => x + '番').join('、')
        : 'なし';
      return `
        <div class="round" id="round-${index + 1}">
          <b>🎾第${index + 1}ラウンド</b>
          ${round.matches.map(renderMatch).join('')}
          <div class="waiting">待機：${waiting}</div>
        </div>`;
    }

    function renderCountTable(n) {
      const rows = Array.from({ length: n }, (_, i) => `
          <tr>
            <td>${i + 1}番</td>
            <td class="done-cell" id="done-count-${i + 1}">0回</td>
          </tr>`).join('');
      return `
        <div class="round">
          <b class="count-title">参加者別 試合数</b>
          <table>
            <thead><tr><th>参加者番号</th><th>完了試合数</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;
    }

    function renderResults(requested) {
      const { courts, n, totalRounds } = session;
      const total = totalRounds * courts;
      $('results').innerHTML = `
        <div class="toolbar">
          <b>抽選結果：${totalRounds}ラウンド・合計${total}試合</b>
          <span>
            <button class="secondary" data-action="again" type="button">再抽選</button>
            <button class="secondary" data-action="print" type="button">印刷</button>
          </span>
        </div>
        ${requested !== total
          ? `<p class="hint">入力された${requested}試合を、全コートを使い切る${total}試合（${totalRounds}ラウンド）に調整しました。</p>`
          : ''}
        <div class="stats">
          <div class="stat"><small>コート数</small><b>${courts}</b></div>
          <div class="stat"><small>参加人数</small><b>${n}</b></div>
          <div class="stat"><small>合計試合数</small><b>${total}</b></div>
          <div class="stat"><small>作成済みラウンド</small><b id="createdRounds">0</b></div>
          <div class="stat"><small>完了試合数</small><b id="doneCount">0</b></div>
        </div>
        <label class="all-check-label">
          <input type="checkbox" id="checkAll"> 作成済みの全ラウンドを一括で完了にする
        </label>
        <div id="rounds"></div>
        <div class="next-area" id="nextArea"></div>
        ${renderCountTable(n)}`;
    }

    // ラウンドを1つ作って末尾に追加する
    function addRound() {
      const { courts, n } = session;
      const index = session.rounds.length;
      const round = createRound(collectStats(n), courts, n, index);

      session.rounds.push(round);
      round.matches.forEach(m => matchByNo.set(m.no, m));
      $('rounds').insertAdjacentHTML('beforeend', renderRound(round, index));
      $('createdRounds').textContent = session.rounds.length;
      updateProgress();
      return index + 1;
    }

    // 一括作成：作成済みの全ラウンドをまとめて表示する
    function showAllRounds(rounds) {
      session.rounds = rounds;
      rounds.forEach(r => r.matches.forEach(m => matchByNo.set(m.no, m)));
      $('rounds').innerHTML = rounds.map(renderRound).join('');
      $('createdRounds').textContent = rounds.length;
      updateProgress();
    }

    // 「次のラウンドを作成」ボタン：直前のラウンドが未完了でも押せる
    function updateNextArea(lastDone) {
      const created = session.rounds.length;
      if (created >= session.totalRounds) {
        $('nextArea').innerHTML = '<p class="hint">全ラウンドを作成しました。</p>';
        return;
      }
      $('nextArea').innerHTML = `
        <button class="primary" data-action="next" type="button">
          第${created + 1}ラウンドを作成
        </button>
        <p class="hint">${lastDone
          ? '完了試合数の実績をもとに、出場回数が均等になるよう組みます。'
          : '第' + created + 'ラウンドに未完了の試合があります。作成すると、第' + created + 'ラウンドは出場済みとして扱います。'}</p>`;
    }

    function updateProgress() {
      const checks = [...document.querySelectorAll('.match-check')];
      const checked = checks.filter(x => x.checked);
      const doneNos = new Set(checked.map(x => Number(x.dataset.match)));
      $('doneCount').textContent = checked.length;

      // 一括チェック：全試合完了ならON、一部だけなら中間表示
      const all = $('checkAll');
      all.checked = checks.length > 0 && checked.length === checks.length;
      all.indeterminate = checked.length > 0 && checked.length < checks.length;
      checks.forEach(x => {
        const card = $('match-' + x.dataset.match);
        card.classList.toggle('done', x.checked);
        card.setAttribute('aria-pressed', x.checked);
      });

      // 参加者別の完了試合数：チェック状態から毎回数え直す（外せば自動で減算）
      const tally = Array(session.n + 1).fill(0);
      doneNos.forEach(no => {
        const m = matchByNo.get(no);
        [...m.teamA, ...m.teamB].forEach(p => tally[p]++);
      });
      for (let i = 1; i <= session.n; i++) {
        $('done-count-' + i).textContent = tally[i] + '回';
      }

      // 最後に作ったラウンドが全て完了か
      const last = session.rounds[session.rounds.length - 1];
      updateNextArea(last.matches.every(m => doneNos.has(m.no)));
    }

    // すべての試合が完了したあとに試合数が増えたとき、作成済みの内容を残して続きのラウンドを作る
    //   順次作成：次のラウンドを1つ作る　／　一括作成：増えた分のラウンドをまとめて作る
    function continueRounds(requested) {
      const { courts, n, mode } = session;
      const old = session.rounds;
      const doneMax = old.length * courts; // これまでの試合はすべて完了済み

      disarm();
      session.totalRounds = Math.ceil(requested / courts);
      session.requested = requested;
      const all = mode === 'bulk' ? old.concat(buildAll(courts, n, session.totalRounds, old)) : old;

      renderResults(requested);
      showAllRounds(all);
      document.querySelectorAll('.match-check').forEach(x => { x.checked = Number(x.dataset.match) <= doneMax; });
      updateProgress();

      const first = mode === 'bulk' ? old.length + 1 : addRound();
      $('round-' + first).scrollIntoView({ behavior: 'smooth' });
    }

    /* ---------- 実行 ---------- */
    // 作り直しの確認：confirm() は埋め込み表示などで無効になり、
    // ボタンが効かないように見えるため、ボタンの2回押しで確認する
    let armed = null, armTimer = null;

    function disarm() {
      if (!armed) return;
      armed.btn.textContent = armed.label;
      armed = null;
      clearTimeout(armTimer);
    }

    function confirmByButton(btn) {
      if (armed && armed.btn === btn) { disarm(); return true; } // 2回目の押下で実行
      disarm();
      armed = { btn, label: btn.textContent };
      btn.textContent = 'もう一度押すと再組合';
      armTimer = setTimeout(disarm, 4000);
      return false;
    }

    function draw(btn) {
      $('error').textContent = '';
      try {
        const courts    = readInt('courts', 'コート数');
        const n         = readInt('players', '参加人数');
        const requested = readInt('totalMatches', '試合数');
        const mode      = document.querySelector('input[name="mode"]:checked').value;

        // 全コートを同時に使うには、1コートあたり4人が必要
        if (n < courts * 4) {
          throw new Error('コート数' + courts + 'には最低' + (courts * 4) + '人必要です。'
            + 'コート数を減らすか、参加人数を増やしてください。');
        }

        // すべての試合が完了していて、同じ設定のまま試合数だけを変えたとき
        //   ・作成済みより増えた → 続きのラウンドを作る
        //   ・減らした（または切り上げ分の範囲内）→ 何もしない
        //   ・作成時と同じ試合数 → 通常の作り直し
        const allDone = session && [...document.querySelectorAll('.match-check')].every(x => x.checked);
        if (allDone && session.courts === courts && session.n === n && session.mode === mode) {
          if (requested > session.totalRounds * courts) {
            continueRounds(requested);
            return;
          }
          if (requested !== session.requested) return;
        }

        // 作成済みの組み合わせやチェックが消える前に確認する
        // （一括作成はチェックがなければ、そのまま作り直す）
        if (session && (document.querySelector('.match-check:checked') ||
                        (session.mode === 'seq' && session.rounds.length > 1)) &&
            !confirmByButton(btn)) {
          return;
        }

        // 試合数は「コート数の倍数」に切り上げ、最終ラウンドも全コートを使う
        const totalRounds = Math.ceil(requested / courts);

        session = { courts, n, totalRounds, rounds: [], mode, requested };
        matchByNo = new Map();
        renderResults(requested);
        if (mode === 'bulk') {
          showAllRounds(buildAll(courts, n, totalRounds)); // 全ラウンドを一度に作る
        } else {
          addRound(); // 最初は第1ラウンドだけ作る
        }
        $('results').scrollIntoView({ behavior: 'smooth' });
      } catch (e) {
        $('error').textContent = e.message;
      }
    }

    $('generate').addEventListener('click', e => draw(e.currentTarget));

    // 試合の枠をタッチ（クリック）すると、完了／取り消しを切り替える
    // （完了の状態は、見えない .match-check に持たせている）
    function toggleMatch(card) {
      const box = card.querySelector('.match-check');
      box.checked = !box.checked;
      updateProgress();
    }

    // 結果エリアのイベントは1回だけ登録（再描画しても付け直し不要）
    const results = $('results');

    results.addEventListener('change', e => {
      if (e.target.id !== 'checkAll') return;
      // 作成済みの全試合をまとめて ON/OFF
      document.querySelectorAll('.match-check').forEach(x => { x.checked = e.target.checked; });
      updateProgress();
    });

    results.addEventListener('keydown', e => {
      if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('match')) {
        e.preventDefault();
        toggleMatch(e.target);
      }
    });

    results.addEventListener('click', e => {
      const card = e.target.closest('.match');
      if (card) {
        toggleMatch(card);
        return;
      }
      const action = e.target.dataset.action;
      if (action === 'again') draw(e.target);
      if (action === 'print') window.print();
      if (action === 'next') {
        const no = addRound();
        $('round-' + no).scrollIntoView({ behavior: 'smooth' });
      }
    });
  })();
  </script>
</body>
</html>
