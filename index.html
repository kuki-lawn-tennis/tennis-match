<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>テニス ダブルス組み合わせ抽選</title>
<style>
body{margin:0;background:#f4f7f5;color:#203027;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
header{background:#176b45;color:white;padding:20px 16px}h1{font-size:21px;margin:0}
main{max-width:850px;margin:18px auto;padding:0 12px 40px}
.panel{background:white;border:1px solid #d9e2dc;border-radius:13px;padding:15px;margin-bottom:14px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{font-weight:650;font-size:14px}
input[type=number]{display:block;width:100%;box-sizing:border-box;margin-top:6px;padding:12px;border:1px solid #b9c8bf;border-radius:8px;font-size:17px}
.hint{font-size:12px;color:#64736a;line-height:1.6}
button{border:0;border-radius:9px;padding:13px 16px;font-size:15px;font-weight:700}
.primary{background:#176b45;color:white;width:100%;margin-top:14px}
.secondary{background:#e8f0eb;color:#145638}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.stat{background:#f0f5f1;padding:9px 12px;border-radius:8px}.stat small{display:block;color:#64736a;font-size:11px}.stat b{font-size:19px}
.match{border:1px solid #d9e2dc;border-radius:10px;padding:11px;margin:8px 0}
.match.done{background:#f0f7f2;border-color:#9bc5a8}
.head{display:flex;justify-content:space-between;font-size:13px;color:#526258;margin-bottom:9px}
.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:7px;align-items:center}
.team{background:#f1f6f2;padding:12px 5px;text-align:center;border-radius:8px;font-weight:700;font-size:14px}
.vs{font-size:12px;color:#78857d}
.match-bottom{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:11px;padding-top:9px;border-top:1px solid #e1e9e3}
.complete-label{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:650;cursor:pointer}
.complete-label input{width:21px;height:21px;accent-color:#176b45}
.done-text{font-size:12px;color:#176b45;font-weight:700}
.waiting{font-size:12px;color:#5d6c62;line-height:1.6;margin-top:8px}
.round{margin-top:18px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:8px;border-bottom:1px solid #d9e2dc;text-align:center}
.progress{height:10px;background:#e5ece7;border-radius:10px;overflow:hidden;margin-top:8px}.bar{height:100%;width:0;background:#238653;transition:width .2s}
@media(max-width:500px){.fields{grid-template-columns:1fr}}
@media print{header{background:white;color:black}main{margin:0}.panel:first-child,.toolbar button,.match-bottom{display:none}.panel{border:0}.match{break-inside:avoid}}
</style>
<header><h1>テニス ダブルス組み合わせ抽選</h1><div class="hint" style="color:white">出場回数を均等化し、ペアと対戦相手をランダムに決定</div></header>
<main>
<section class="panel">
<div class="fields">
<label>コート数<input id="courts" type="number" min="1" max="30" value="3"></label>
<label>参加人数<input id="players" type="number" min="4" max="200" value="20"></label>
<label>試合数<input id="totalMatches" type="number" min="1" max="1000" value="100"></label>
</div>
<p class="hint">指定した試合数を作成します。出場回数が少ない人を優先し、同数なら番号の小さい順に選びます。選ばれた人のペア・対戦相手はランダムです。</p>
<button class="primary" id="generate" type="button">組み合わせを作成</button><p id="error" class="hint" style="color:#b42318"></p>
</section>
<section class="panel" id="results"><div class="hint">コート数・参加人数・試合数を入力して「組み合わせを作成」を押してください。</div></section>
</main>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function draw(){
const courts=Number($('courts').value),n=Number($('players').value),total=Number($('totalMatches').value);
$('error').textContent='';
if(!Number.isInteger(courts)||courts<1||courts>30){$('error').textContent='コート数は1〜30で入力してください。';return}
if(!Number.isInteger(n)||n<4||n>200){$('error').textContent='参加人数は4〜200で入力してください。';return}
if(!Number.isInteger(total)||total<1||total>1000){$('error').textContent='試合数は1〜1000で入力してください。';return}
const per=Math.min(courts,Math.floor(n/4)),rounds=Math.ceil(total/per);
const played=Array(n+1).fill(0);let matchNo=0;
let h='<div class="toolbar"><b>抽選結果：合計'+total+'試合</b><span><button class="secondary" id="again" type="button">再抽選</button> <button class="secondary" id="print" type="button">印刷</button></span></div>';
h+='<div class="stats"><div class="stat"><small>コート数</small><b>'+courts+'</b></div><div class="stat"><small>参加人数</small><b>'+n+'</b></div><div class="stat"><small>合計試合数</small><b>'+total+'</b></div><div class="stat"><small>完了試合数</small><b id="doneCount">0</b></div></div>';
h+='<div class="hint" id="progressText">試合完了状況：0 / '+total+'</div><div class="progress"><div class="bar" id="progressBar"></div></div>';
for(let r=1;r<=rounds;r++){
const m=Math.min(per,total-matchNo),slots=m*4;
const chosen=Array.from({length:n},(_,i)=>i+1).sort((a,b)=>played[a]-played[b]||a-b).slice(0,slots);
const players=shuffle(chosen),waiting=Array.from({length:n},(_,i)=>i+1).filter(x=>!chosen.includes(x));
h+='<div class="round"><b>第'+r+'ラウンド</b>';
for(let c=1;c<=m;c++){
const p=players.slice((c-1)*4,c*4);p.forEach(x=>played[x]++);matchNo++;
h+='<div class="match" id="match-'+matchNo+'"><div class="head"><span>第'+matchNo+'試合</span><b>コート'+c+'</b></div><div class="teams"><div class="team">'+p[0]+'番・'+p[1]+'番</div><div class="vs">VS</div><div class="team">'+p[2]+'番・'+p[3]+'番</div></div><div class="match-bottom"><label class="complete-label"><input type="checkbox" class="match-check" data-match="'+matchNo+'"> 試合完了</label><span class="done-text" id="done-text-'+matchNo+'"></span></div></div>';
}
h+='<div class="waiting">待機：'+(waiting.length?waiting.map(x=>x+'番').join('、'):'なし')+'</div></div>';
}
const min=Math.min(...played.slice(1)),max=Math.max(...played.slice(1));
h+='<div class="round"><b>参加者別 出場回数</b><p class="hint">最多 '+max+' 回／最少 '+min+' 回（差 '+(max-min)+' 回）</p><table><tr><th>参加者番号</th><th>出場回数</th></tr>';
for(let i=1;i<=n;i++)h+='<tr><td>'+i+'番</td><td>'+played[i]+'回</td></tr>';
h+='</table></div>';
$('results').innerHTML=h;
function updateProgress(){
const checks=[...document.querySelectorAll('.match-check')],done=checks.filter(x=>x.checked).length;
$('doneCount').textContent=done;$('progressText').textContent='試合完了状況：'+done+' / '+total;$('progressBar').style.width=(done/total*100)+'%';
checks.forEach(x=>{const id=x.dataset.match,card=$('match-'+id),label=$('done-text-'+id);card.classList.toggle('done',x.checked);label.textContent=x.checked?'完了':''});
}
document.querySelectorAll('.match-check').forEach(x=>x.addEventListener('change',updateProgress));
$('again').addEventListener('click',draw);$('print').addEventListener('click',()=>window.print());
$('results').scrollIntoView({behavior:'smooth'});
}
$('generate').addEventListener('click',draw);
})();
</script>
</html>
